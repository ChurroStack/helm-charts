apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: churrun-kubernetes-full-namespace-access
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: churrun-kubernetes
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: full-namespace-access
  apiGroup: rbac.authorization.k8s.io